<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Dana's Trading Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rose:        #A8324F;
            --rose-light:  #E89BB5;
            --rose-pale:   #F5C8D6;
            --rose-bg:     #FBE8EE;
            --cream:       #FEF8F0;
            --gold-pale:   #F0DFB8;
            --ink:         #2A1A1F;
            --ink-mid:     #7A4A5C;
            --ink-soft:    #8C6070;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 640px; height: 640px;
            top: -220px; left: -220px;
            border-radius: 50%;
            background: radial-gradient(circle, #E8839A 0%, transparent 65%);
            opacity: 0.45;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 520px; height: 520px;
            bottom: -160px; right: -120px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold-pale) 0%, transparent 65%);
            opacity: 0.55;
            pointer-events: none;
        }

        /* ── Card ────────────────────────────────────────────────── */
        .card {
            background: white;
            border-radius: 32px;
            padding: 52px 48px 44px;
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--rose-light);
            box-shadow: 0 24px 80px rgba(168,50,79,0.12);
            position: relative;
            z-index: 1;
            animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Brand ───────────────────────────────────────────────── */
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }
        .brand-icon {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, var(--rose-pale), var(--rose-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(168,50,79,0.2);
        }
        .brand h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 34px;
            font-weight: 300;
            color: var(--ink);
            line-height: 1;
        }
        .brand h1 em {
            font-style: italic;
            color: var(--rose);
        }
        .brand p {
            font-size: 12.5px;
            color: var(--ink-mid);
            margin-top: 8px;
            letter-spacing: 0.04em;
        }

        /* ── Alert ───────────────────────────────────────────────── */
        .alert {
            background: #FDE8ED;
            border: 1px solid var(--rose-light);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--rose);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-icon { font-size: 15px; flex-shrink: 0; }

        /* ── Role selector ───────────────────────────────────────── */
        .role-section {
            margin-bottom: 28px;
        }
        .role-section-label {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--ink-mid);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }
        .role-cards {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .role-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0; height: 0;
        }
        .role-card label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 18px 12px;
            border: 2px solid #EDD8E0;
            border-radius: 18px;
            background: var(--cream);
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            height: 100%;
        }
        .role-card label:hover {
            border-color: var(--rose-light);
            background: var(--rose-bg);
        }
        .role-card input[type="radio"]:checked + label {
            border-color: var(--rose);
            background: #FDE8ED;
            box-shadow: 0 4px 16px rgba(168,50,79,0.15);
        }
        .role-icon {
            font-size: 26px;
            line-height: 1;
        }
        .role-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
        }
        .role-desc {
            font-size: 11px;
            color: var(--ink-soft);
            line-height: 1.4;
        }
        .role-card input[type="radio"]:checked + label .role-name {
            color: var(--rose);
        }

        /* ── Fields ──────────────────────────────────────────────── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--ink-mid);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #EDD8E0;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--ink);
            background: var(--cream);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .field input::placeholder { color: #C4A0AD; }
        .field input:focus {
            border-color: var(--rose-light);
            box-shadow: 0 0 0 3px rgba(232,155,181,0.2);
            background: white;
        }

        /* ── Password strength ───────────────────────────────────── */
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 44px; }
        .pw-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink-soft);
            padding: 0;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: var(--rose); }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .strength-seg {
            flex: 1;
            height: 3px;
            border-radius: 99px;
            background: #EDD8E0;
            transition: background 0.3s;
        }
        .strength-label {
            font-size: 11px;
            color: var(--ink-soft);
            margin-top: 5px;
        }

        /* ── Password match hint ─────────────────────────────────── */
        .match-hint {
            font-size: 11.5px;
            margin-top: 5px;
            min-height: 16px;
            transition: color 0.2s;
        }
        .match-hint.ok  { color: #4A9D6F; }
        .match-hint.err { color: var(--rose); }

        /* ── Submit ──────────────────────────────────────────────── */
        .submit-btn {
            width: 100%;
            background: var(--ink);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            margin-bottom: 20px;
        }
        .submit-btn:hover {
            background: var(--rose);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(168,50,79,0.3);
        }
        .submit-btn:active { transform: translateY(0); }

        /* ── Divider ─────────────────────────────────────────────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .divider span {
            font-size: 11px;
            color: #C4A0AD;
            letter-spacing: 0.04em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #EDD8E0;
        }

        .footer-link {
            text-align: center;
            font-size: 13px;
            color: var(--ink-soft);
        }
        .footer-link a {
            color: var(--rose);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .footer-link a:hover { opacity: 0.75; }

        /* ── Section divider inside form ─────────────────────────── */
        .form-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 400;
            color: var(--ink-mid);
            letter-spacing: 0.03em;
            margin: 24px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #EDD8E0;
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <h1>Create <em>Account</em></h1>
            <p>Start your trading journal journey</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">
                    <span class="alert-icon">⚠</span>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <!-- ── Role selection ──────────────────────────────── -->
            <div class="role-section">
                <span class="role-section-label">I am joining as</span>
                <div class="role-cards" style="grid-template-columns: 1fr 1fr 1fr;">

                    <div class="role-card">
                        <input
                            type="radio"
                            id="role_client"
                            name="role"
                            value="client"
                            {% if request.POST.role != "admin" and request.POST.role != "assistant" %}checked{% endif %}
                        >
                        <label for="role_client">
                            <span class="role-icon">📈</span>
                            <span class="role-name">Client</span>
                            <span class="role-desc">Track your personal trades & journal</span>
                        </label>
                    </div>

                    <div class="role-card">
                        <input
                            type="radio"
                            id="role_assistant"
                            name="role"
                            value="assistant"
                            {% if request.POST.role == "assistant" %}checked{% endif %}
                        >
                        <label for="role_assistant">
                            <span class="role-icon">🤝</span>
                            <span class="role-name">Assistant</span>
                            <span class="role-desc">Support clients & view trading activity</span>
                        </label>
                    </div>

                    <div class="role-card">
                        <input
                            type="radio"
                            id="role_admin"
                            name="role"
                            value="admin"
                            {% if request.POST.role == "admin" %}checked{% endif %}
                        >
                        <label for="role_admin">
                            <span class="role-icon">⚙</span>
                            <span class="role-name">Admin</span>
                            <span class="role-desc">Manage clients & oversee accounts</span>
                        </label>
                    </div>

                </div>
            </div>

            <!-- ── Personal info ───────────────────────────────── -->
            <p class="form-section-title">Personal Information</p>

            <div class="two-col">
                <div class="field">
                    <label for="first_name">First Name *</label>
                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        value="{{ request.POST.first_name }}"
                        required
                    >
                </div>
                <div class="field">
                    <label for="last_name">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        value="{{ request.POST.last_name }}"
                    >
                </div>
            </div>

            <div class="field">
                <label for="email">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="dana@example.com"
                    value="{{ request.POST.email }}"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- ── Account credentials ─────────────────────────── -->
            <p class="form-section-title">Account Credentials</p>

            <div class="field">
                <label for="username">Username *</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="your_username"
                    value="{{ request.POST.username }}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password1">Password *</label>
                <div class="pw-wrap">
                    <input
                        type="password"
                        id="password1"
                        name="password1"
                        placeholder="Min. 8 characters"
                        autocomplete="new-password"
                        required
                    >
                    <button type="button" class="pw-toggle" id="pwToggle1" aria-label="Show password">👁</button>
                </div>
                <div class="strength-bar" id="strengthBar">
                    <div class="strength-seg" id="s1"></div>
                    <div class="strength-seg" id="s2"></div>
                    <div class="strength-seg" id="s3"></div>
                    <div class="strength-seg" id="s4"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <div class="field">
                <label for="password2">Confirm Password *</label>
                <div class="pw-wrap">
                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                    >
                    <button type="button" class="pw-toggle" id="pwToggle2" aria-label="Show confirm password">👁</button>
                </div>
                <div class="match-hint" id="matchHint"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">CREATE ACCOUNT</button>
        </form>

        <div class="divider"><span>already have an account?</span></div>

        <p class="footer-link">
            <a href="{% url 'login' %}">Sign in instead</a>
        </p>

    </div>

    <script>
        /* ── Show/hide password ───────────────────────────────────── */
        function makeToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const inp = document.getElementById(inputId);
            btn.addEventListener('click', () => {
                if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
                else                         { inp.type = 'password'; btn.textContent = '👁'; }
            });
        }
        makeToggle('pwToggle1', 'password1');
        makeToggle('pwToggle2', 'password2');

        /* ── Password strength ───────────────────────────────────── */
        const pw1    = document.getElementById('password1');
        const segs   = [document.getElementById('s1'), document.getElementById('s2'),
                        document.getElementById('s3'), document.getElementById('s4')];
        const sLabel = document.getElementById('strengthLabel');

        const COLORS = ['#E8839A', '#F0B36B', '#8ABFCF', '#4A9D6F'];
        const LABELS = ['Weak', 'Fair', 'Good', 'Strong'];

        function calcStrength(pw) {
            let score = 0;
            if (pw.length >= 8)  score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            return score;
        }

        pw1.addEventListener('input', () => {
            const val = pw1.value;
            const score = val ? calcStrength(val) : 0;
            segs.forEach((s, i) => {
                s.style.background = i < score ? COLORS[score - 1] : '#EDD8E0';
            });
            sLabel.textContent = val ? LABELS[score - 1] || '' : '';
            checkMatch();
        });

        /* ── Password match ──────────────────────────────────────── */
        const pw2   = document.getElementById('password2');
        const hint  = document.getElementById('matchHint');

        function checkMatch() {
            if (!pw2.value) { hint.textContent = ''; return; }
            if (pw1.value === pw2.value) {
                hint.textContent = '✓ Passwords match';
                hint.className = 'match-hint ok';
            } else {
                hint.textContent = '✗ Passwords do not match';
                hint.className = 'match-hint err';
            }
        }

        pw2.addEventListener('input', checkMatch);
    </script>
</body>
</html>
