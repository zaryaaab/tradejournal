<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Dana's Trading Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rose:        #A8324F;
            --rose-light:  #E89BB5;
            --rose-pale:   #F5C8D6;
            --rose-bg:     #FBE8EE;
            --cream:       #FEF8F0;
            --gold-pale:   #F0DFB8;
            --ink:         #2A1A1F;
            --ink-mid:     #7A4A5C;
            --ink-soft:    #8C6070;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* ── Background orbs ─────────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            width: 640px; height: 640px;
            top: -220px; left: -220px;
            border-radius: 50%;
            background: radial-gradient(circle, #E8839A 0%, transparent 65%);
            opacity: 0.45;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 520px; height: 520px;
            bottom: -160px; right: -120px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold-pale) 0%, transparent 65%);
            opacity: 0.55;
            pointer-events: none;
        }

        /* ── Card ────────────────────────────────────────────────── */
        .card {
            background: white;
            border-radius: 32px;
            padding: 52px 48px 44px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--rose-light);
            box-shadow: 0 24px 80px rgba(168,50,79,0.12);
            position: relative;
            z-index: 1;
            animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Brand ───────────────────────────────────────────────── */
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }
        .brand-icon {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, var(--rose-pale), var(--rose-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(168,50,79,0.2);
        }
        .brand h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 34px;
            font-weight: 300;
            color: var(--ink);
            line-height: 1;
        }
        .brand h1 em {
            font-style: italic;
            color: var(--rose);
        }
        .brand p {
            font-size: 12.5px;
            color: var(--ink-mid);
            margin-top: 8px;
            letter-spacing: 0.04em;
        }

        /* ── Alert messages ──────────────────────────────────────── */
        .alert {
            background: #FDE8ED;
            border: 1px solid var(--rose-light);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--rose);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-icon { font-size: 15px; flex-shrink: 0; }

        /* ── Form ────────────────────────────────────────────────── */
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--ink-mid);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #EDD8E0;
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--ink);
            background: var(--cream);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .field input::placeholder { color: #C4A0AD; }
        .field input:focus {
            border-color: var(--rose-light);
            box-shadow: 0 0 0 3px rgba(232,155,181,0.2);
            background: white;
        }

        /* ── Password wrapper (with show/hide) ───────────────────── */
        .pw-wrap {
            position: relative;
        }
        .pw-wrap input { padding-right: 44px; }
        .pw-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink-soft);
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: var(--rose); }

        /* ── Forgot link ─────────────────────────────────────────── */
        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }
        .field-row label {
            margin-bottom: 0;
        }
        .forgot {
            font-size: 11.5px;
            color: var(--ink-soft);
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot:hover { color: var(--rose); }

        /* ── Submit ──────────────────────────────────────────────── */
        .submit-btn {
            width: 100%;
            background: var(--ink);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            margin-bottom: 20px;
        }
        .submit-btn:hover {
            background: var(--rose);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(168,50,79,0.3);
        }
        .submit-btn:active { transform: translateY(0); }

        /* ── Divider ─────────────────────────────────────────────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .divider span {
            font-size: 11px;
            color: #C4A0AD;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #EDD8E0;
        }

        /* ── Footer link ─────────────────────────────────────────── */
        .footer-link {
            text-align: center;
            font-size: 13px;
            color: var(--ink-soft);
        }
        .footer-link a {
            color: var(--rose);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .footer-link a:hover { opacity: 0.75; }

        /* ── Role badge row ──────────────────────────────────────── */
        .role-pills {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }
        .role-pill {
            flex: 1;
            text-align: center;
            padding: 10px 12px;
            background: var(--cream);
            border: 1.5px solid #EDD8E0;
            border-radius: 12px;
            font-size: 12px;
            color: var(--ink-soft);
            cursor: default;
        }
        .role-pill strong {
            display: block;
            font-size: 13px;
            color: var(--ink);
            margin-bottom: 2px;
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <h1>Welcome <em>Back</em></h1>
            <p>Sign in to your trading journal</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">
                    <span class="alert-icon">⚠</span>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="your_username"
                    value="{{ request.POST.username }}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <div class="field-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>
                <div class="pw-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">👁</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">SIGN IN</button>
        </form>

       

        


    </div>

    <script>
        const toggle = document.getElementById('pwToggle');
        const pwInput = document.getElementById('password');
        toggle.addEventListener('click', () => {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                toggle.textContent = '🙈';
            } else {
                pwInput.type = 'password';
                toggle.textContent = '👁';
            }
        });
    </script>
</body>
</html>
