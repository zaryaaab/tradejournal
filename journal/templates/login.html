<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Dana's Trading Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --neon-bg: #0f0f14;
            --neon-accent: #ff2ea6;
            --neon-accent-soft: #ff6bd6;
            --neon-purple: #b026ff;
            --neon-inner: #1a1520;
            --neon-text: #ffffff;
            --neon-text-secondary: #cfcfd6;
            --neon-tagline: #ffe066;
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--neon-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            color: var(--neon-text);
        }

        body::before {
            content: '';
            position: fixed;
            width: 520px;
            height: 520px;
            top: -180px;
            left: -140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 46, 166, 0.35) 0%, transparent 68%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 480px;
            height: 480px;
            bottom: -160px;
            right: -120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(176, 38, 255, 0.28) 0%, transparent 68%);
            pointer-events: none;
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: loginRise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes loginRise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(26, 21, 32, 0.85);
            border-radius: 20px;
            padding: 44px 40px 40px;
            border: 1px solid var(--neon-accent);
            box-shadow:
                0 0 28px rgba(255, 46, 166, 0.22),
                0 0 56px rgba(176, 38, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
        }

        .login-tagline {
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--neon-tagline);
            margin-bottom: 22px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff2ea6 0%, #ff4fd8 50%, #b026ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 8px 28px rgba(255, 46, 166, 0.45);
        }

        .brand h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.75rem, 4vw, 2.125rem);
            font-weight: 400;
            line-height: 1.15;
            color: #fff;
        }

        .brand h1 .brand-script {
            font-style: italic;
            font-weight: 400;
        }

        .brand h1 .brand-neon {
            display: block;
            margin-top: 6px;
            font-family: var(--font-sans);
            font-size: clamp(1.1rem, 2.8vw, 1.35rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--neon-accent);
            text-shadow:
                0 0 18px rgba(255, 46, 166, 0.75),
                0 0 36px rgba(176, 38, 255, 0.35);
        }

        .brand p {
            font-size: 13px;
            color: var(--neon-text-secondary);
            margin-top: 10px;
            letter-spacing: 0.02em;
        }

        .alert {
            background: rgba(179, 0, 0, 0.18);
            border: 1px solid rgba(255, 46, 166, 0.45);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ffb8c4;
            margin-bottom: 22px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert-icon {
            flex-shrink: 0;
            margin-top: 1px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--neon-text-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 46, 166, 0.35);
            border-radius: 12px;
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--neon-text);
            background: rgba(15, 15, 20, 0.9);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .field input::placeholder {
            color: rgba(207, 207, 214, 0.45);
        }

        .field input:focus {
            border-color: var(--neon-accent);
            box-shadow:
                0 0 0 3px rgba(255, 46, 166, 0.2),
                0 0 20px rgba(255, 46, 166, 0.15);
        }

        .pw-wrap {
            position: relative;
        }

        .pw-wrap input {
            padding-right: 48px;
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--neon-text-secondary);
            padding: 4px;
            line-height: 1;
            opacity: 0.85;
            transition: color 0.2s, opacity 0.2s;
        }

        .pw-toggle:hover {
            color: var(--neon-accent-soft);
            opacity: 1;
        }

        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .field-row label {
            margin-bottom: 0;
        }

        .forgot {
            font-size: 11.5px;
            color: var(--neon-accent-soft);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot:hover {
            color: var(--neon-accent);
        }

        .submit-btn {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 0;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #ff2ea6, #b026ff);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 28px rgba(255, 46, 166, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }

        .submit-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 10px 36px rgba(255, 46, 166, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="login-shell">
        <div class="login-card">
            <p class="login-tagline">God · Patience · Discipline</p>

            <div class="brand">
                <div class="brand-icon" aria-hidden="true">✦</div>
                <h1>
                    <span class="brand-script">Welcome</span>
                    <span class="brand-neon">Back</span>
                </h1>
                <p>Sign in to your trading journal.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert" role="alert">
                        <span class="alert-icon" aria-hidden="true">⚠</span>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="your_username"
                        value="{{ request.POST.username }}"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="field">
                    <div class="field-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot">Forgot password?</a>
                    </div>
                    <div class="pw-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">👁</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Sign in</button>
            </form>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('pwToggle');
        const pwInput = document.getElementById('password');
        toggle.addEventListener('click', () => {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                toggle.textContent = '🙈';
            } else {
                pwInput.type = 'password';
                toggle.textContent = '👁';
            }
        });
    </script>
</body>
</html>
