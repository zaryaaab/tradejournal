<div class="nav-section-label sidebar-overview-label">Broker accounts · overview</div>
<p class="sidebar-overview-meta">
    <strong>{{ sidebar_trading_accounts_total }}</strong> active
    {% if sidebar_trading_accounts_archived_count %}
    · {{ sidebar_trading_accounts_archived_count }} archived
    {% endif %}
</p>
{% if can_manage_trading_accounts %}
<div class="sidebar-overview-link-wrap">
    <a href="{% url 'trading_accounts_list' %}" class="sidebar-overview-link">Manage all broker accounts →</a>
</div>
{% endif %}
<form method="post" action="{% url 'select_trading_account' %}" class="sidebar-scope-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <label class="sidebar-scope-label" for="sidebar-scope-select">Calendar &amp; analytics scope</label>
    <select name="trading_account_id" id="sidebar-scope-select" class="sidebar-scope-select" onchange="this.form.submit()">
        <option value="all"{% if not selected_trading_account_id %} selected{% endif %}>All active accounts</option>
        {% for acc in sidebar_trading_accounts_all %}
        <option value="{{ acc.id }}"{% if selected_trading_account_id == acc.id %} selected{% endif %}>
            {{ acc.name }} — {{ acc.broker }} ({{ acc.account_number }})
        </option>
        {% endfor %}
    </select>
</form>
